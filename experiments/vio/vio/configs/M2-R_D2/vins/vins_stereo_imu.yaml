%YAML:1.0

# VINS-Fusion config for the FLIR/Ouster dataset (generated by make_vio_config.py from experiments/rigc/intrinsics/cam0_D2_M2-R.yaml + experiments/rigc/intrinsics/cam1_D2_M2-R.yaml (pre-rectified, zero distortion)).
# Intrinsics: cam0.yaml / cam1.yaml next to this file. Extrinsics and td fixed from Kalibr calib-camchain-imu0-cam.yaml.
imu: 1
num_of_cam: 2

imu_topic: "/sensors/imu0"
image0_topic: "/sensors/cam0/image_raw"
image1_topic: "/sensors/cam1/image_raw"
output_path: "/tmp/vins_output/"

cam0_calib: "cam0.yaml"
cam1_calib: "cam1.yaml"
image_width: 1440
image_height: 1080

# body_T_cam = inv(T_cam_imu) from Kalibr. estimate_extrinsic 0 = fixed (the experiment varies intrinsics only).
estimate_extrinsic: 0

body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [-0.999953848611516, -0.003160051758697871, -0.00907274599546121, 0.0371485758628771, 0.009063231201343024, 0.0030123788012199337, -0.9999543906669681, -0.0742042891510079, 0.0031872381785503934, -0.9999904697780069, -0.0029835994960583367, -0.022458925264603854, 0.0, 0.0, 0.0, 1.0]

body_T_cam1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [-0.9998764144161265, -0.003571686921045797, 0.015310092974527179, -0.08042186073121298, -0.015285931783162624, -0.006696611639312517, -0.9998607381441043, -0.074148026569727, 0.003673715268108669, -0.9999711988077908, 0.006641187472027182, -0.021910110919426486, 0.0, 0.0, 0.0, 1.0]

multiple_thread: 0   # 1 makes Estimator::inputImage use only every 2nd image (inputImageCnt % 2) -> 5 Hz on a 10 Hz camera

# feature tracker (1440x1080 @ 10 Hz)
max_cnt: 200
min_dist: 40
freq: 0          # 0 = every image; freq=10 on an exactly-10 Hz stream dropped every other frame (5 Hz output)
F_threshold: 1.0
show_track: 0
flow_back: 1

# optimisation
max_solver_time: 0.08
max_num_iterations: 8
keyframe_parallax: 10.0

# IMU noise = 5 x Allan (imu0.yaml); raw Allan values over-trust the IMU
acc_n: 0.093
gyr_n: 0.009349999999999999
acc_w: 0.02165
gyr_w: 0.00133
g_norm: 9.81

# camera-IMU time offset: "readed image clock + td = IMU clock" == Kalibr timeshift_cam_imu (t_imu = t_cam + shift)
estimate_td: 0
td: 0.013639721669437714

load_previous_pose_graph: 0
pose_graph_save_path: "/tmp/vins_output/pose_graph/"
save_image: 0
