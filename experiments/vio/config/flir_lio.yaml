# FAST-LIVO2 config, FLIR/Ouster dataset, LIO-only reference run (img_en 0).
common:
  img_topic: "/sensors/cam0/image_raw"   # republished from /sensors/cam0/compressed by flir.launch
  lid_topic: "/sensors/lidar0"
  imu_topic: "/sensors/imu0"
  img_en: 0
  lidar_en: 1
  ros_driver_bug_fix: false

# ---------------------------------------------------------------------------
# Extrinsics (see extrinsics/derived_extrinsics.yaml, scripts/derive_extrinsics.py)
#   extrinsic_R/extrinsic_T : LiDAR -> IMU  (p_imu = R p_lidar + T)
#   Rcl/Pcl                 : LiDAR -> cam0 (p_cam = Rcl p_lidar + Pcl)
#   T_imu_lidar = inv(T_cam0_imu [Kalibr calib-camchain-imu0-cam.yaml]) @ T_cam0_lidar [FAST-Calib]
#   T_cam0_lidar source: gui_datasets/ouster_flir_april/fast_calib_gui_results/
#                        april_extrinsic_20260725_191352/extrinsic_cam0.yaml (189 frames, p2p RMS 11.4 mm)
#   (the 8-frame GUI run 20260727_203627_cam0 disagrees with every cam1 result by ~19 mm / 2.3 deg
#    after the stereo-chain check, so it is NOT used; its numbers are in derived_extrinsics.yaml)
# ---------------------------------------------------------------------------
extrin_calib:
  extrinsic_T: [-0.0035173164130477066, -0.04904337512304028, 0.023119362071778126]
  extrinsic_R: [0.9997430502922768, 0.017974646928970894, -0.013811062959513018,
                -0.018211595503498993, 0.9996857414677802, -0.0172266100911017,
                0.013497080480968673, 0.017473705210765984, 0.9997562195078837]
  Rcl: [-0.9998189482527658, -0.008857741510080615, 0.016840758001768714,
        -0.01671105185934867, -0.014518907361636791, -0.9997549410104348,
        0.009100080246223937, -0.9998553604118776, 0.014368256510359145]
  Pcl: [0.041037323527116434, -0.045373552436742945, -0.02492680249929014]

time_offset:
  imu_time_offset: 0.0
  # Kalibr timeshift_cam_imu for cam0 = +0.013639721669437714 s, defined as t_imu = t_cam + shift.
  # FAST-LIVO2 uses msg_header_time = stamp + img_time_offset, so the same sign applies.
  img_time_offset: 0.013639721669437714
  lidar_time_offset: 0.0
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 4          # 262144 raw pts/scan (~78 % valid) -> ~50k before voxel filter
  filter_size_surf: 0.1
  lidar_type: 9                # OUSTER_FLIR: added in src/preprocess.cpp for this dataset (x,y,z f32; intensity u8; time f64 ns; ring u16)
  ouster_time_scale_to_ms: 1.0e-6   # per-point 'time' field is ns since scan start -> ms
  scan_line: 128
  blind: 0.8

vio:
  max_iterations: 5
  outlier_threshold: 1000
  img_point_cov: 100
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1

imu:
  imu_en: true
  init_mode: 1
  pre_lidar_imu_keep_time: 0.3
  imu_int_frame: 30
  acc_cov: 0.01
  gyr_cov: 0.01
  b_acc_cov: 0.001
  b_gyr_cov: 0.001

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0025
  voxel_size: 0.5
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

local_map:
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8

uav:
  imu_rate_odom: false
  gravity_align_en: false

publish:
  dense_map_en: false
  pub_effect_point_en: false
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0
  lazy_pub_en: true

compat:
  ltloc_outputs_en: false

evo:
  seq_name: "flir_run"        # overridden by flir.launch (evo/seq_name) -> FAST-LIVO2/Log/result/<seq_name>.txt
  pose_output_en: true

pcd_save:
  pcd_save_en: false
  type: 0
  colmap_output_en: false
  filter_size_pcd: 0.15
  interval: -1

image_save:
  img_save_en: false
  interval: 1
