# FLIR cam0 (1440x1080), vikit Pinhole format used by FAST-LIVO2 (same keys as config/camera_fs.yaml).
# PLACEHOLDER = Kalibr cam0 intrinsics from
#   data/rigc/kalibr_D2/calib-camchain-imu0-cam.yaml
# distortion_model radtan: d0=k1, d1=k2, d2=p1, d3=p2 (OpenCV order).
# NOTE: vikit's loader (rpg_vikit/vikit_ros/include/vikit/camera_loader.h) reads ONLY cam_d0..cam_d3;
#       the PinholeCamera class itself stores and uses 5 coefficients (d_[4] = k3 in the r^6 term),
#       but the loader never passes it, so k3 is silently 0 unless patches/vikit_cam_d4.patch is applied.
# scale: images are resized by this factor before tracking (fx,fy,cx,cy are scaled accordingly inside vikit).
cam_model: Pinhole
cam_width: 1440
cam_height: 1080
scale: 1.0
cam_fx: 476.90725234274964
cam_fy: 476.95921523826524
cam_cx: 720.5493015512368
cam_cy: 557.5868494955138
cam_d0: -0.2908350629887621
cam_d1: 0.0724987249850815
cam_d2: 0.0005710081088912554
cam_d3: 0.0005936548939904376
cam_d4: 0.0   # k3, ignored by the stock loader (see note above)
