# LIO sweep variant L3_surf005 of rigd_lio.yaml
# Rig-D sequence (rigd_office1.bag): FAST-LIVO2 LIO-only (img_en 0) reference config (experiments/vio/rigd).
# Copied from ../../config/flir_lio.yaml; changed: topics, lidar_type 8 (FSLIDAR handler: x,y,z,intensity f32 + 'timestamp' f64
# absolute microseconds, header.stamp = first point; /echo1_roi0 has exactly this layout, same as FPV2 /points_roi0),
# point_filter_num 1 / scan_line 1 (22.4k pts/scan, solid-state), extrinsic_R/T = FPV2 convention (IMU pre-rotated,
# LiDAR-IMU rotation identity, lever arm 0), Rcl/Pcl = extrinsics/extrinsic_cam_lidar.yaml.
common:
  img_topic: "/cam0/image_raw"   # unused (img_en 0)
  lid_topic: "/echo1_roi0"
  imu_topic: "/imu_raw"            # accelerometer in g; FAST-LIVO2 normalises |acc| at init
  img_en: 0
  lidar_en: 1
  ros_driver_bug_fix: false

# ---------------------------------------------------------------------------
# Extrinsics (see ../extrinsics/derived_extrinsics.yaml, ../scripts/derive_extrinsics.py)
#   extrinsic_R/extrinsic_T : LiDAR -> IMU  (p_imu = R p_lidar + T)
#   Rcl/Pcl                 : LiDAR -> cam0 (p_cam = Rcl p_lidar + Pcl)
#   T_imu_lidar = inv(T_cam0_imu [Kalibr calib-camchain-imu0-cam.yaml]) @ T_cam0_lidar [FAST-Calib]
#   T_cam0_lidar source: ../../extrinsics/fastcalib/april_20260725_191352_cam0.yaml (189 frames, p2p RMS 11.4 mm)
#   (the 8-frame GUI run 20260727_203627_cam0 disagrees with every cam1 result by ~19 mm / 2.3 deg
#    after the stereo-chain check, so it is NOT used; its numbers are in derived_extrinsics.yaml)
# ---------------------------------------------------------------------------
extrin_calib:
  extrinsic_T: [0.0, 0.0, 0.0]
  extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  Rcl: [0.009245034736141175, -0.9999540786064112, -0.0025238880979713703,
        0.003320267861701163, 0.0025546792561897233, -0.9999912246791093,
        0.9999517514130641, 0.009236573623456408, 0.0033437334888374486]
  Pcl: [-0.044815270356941314, -0.0008009416546956721, 0.031748221785251385]

time_offset:
  imu_time_offset: 0.0
  # Kalibr timeshift_cam_imu for cam0 = +0.013639721669437714 s, defined as t_imu = t_cam + shift.
  # FAST-LIVO2 uses msg_header_time = stamp + img_time_offset, so the same sign applies.
  img_time_offset: 0.0
  lidar_time_offset: 0.0
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 1
  filter_size_surf: 0.05
  lidar_type: 8                # FSLIDAR
  scan_line: 1
  blind: 0.5                   # indoor office (FAST_LIO fs_office_indoor.yaml convention: 1.0 drops 27 % of the points)

vio:
  max_iterations: 5
  outlier_threshold: 1000
  img_point_cov: 100
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1

imu:
  imu_en: true
  init_mode: 1
  pre_lidar_imu_keep_time: 0.3
  imu_int_frame: 30
  acc_cov: 0.01
  gyr_cov: 0.01
  b_acc_cov: 0.001
  b_gyr_cov: 0.001

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0025
  voxel_size: 0.5
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

local_map:
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8

uav:
  imu_rate_odom: false
  gravity_align_en: false

publish:
  dense_map_en: false
  pub_effect_point_en: false
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0
  lazy_pub_en: true

compat:
  ltloc_outputs_en: false

evo:
  seq_name: "flir_run"        # overridden by flir.launch (evo/seq_name) -> FAST-LIVO2/Log/result/<seq_name>.txt
  pose_output_en: true

pcd_save:
  pcd_save_en: false
  type: 0
  colmap_output_en: false
  filter_size_pcd: 0.15
  interval: -1

image_save:
  img_save_en: false
  interval: 1
