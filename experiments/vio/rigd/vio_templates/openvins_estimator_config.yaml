%YAML:1.0 # OpenVINS estimator config, Rig-D mono (copied from ../vio/templates; changes are marked "Rig-D")

verbosity: "INFO"

use_fej: true
integration: "rk4"
use_stereo: false   # flir_vio.launch overrides use_stereo / max_cameras
max_cameras: 1

# Online calibration is DISABLED on purpose: the experiment measures the effect of the supplied
# camera intrinsics, so the filter must not refine them. Flip to true to see how much OpenVINS
# would self-correct a given intrinsics set.
calib_cam_extrinsics: false
calib_cam_intrinsics: false
calib_cam_timeoffset: false
calib_imu_intrinsics: false
calib_imu_g_sensitivity: false

max_clones: 11
max_slam: 50
max_slam_in_update: 25
max_msckf_in_update: 40
dt_slam_delay: 1

gravity_mag: 9.81

feat_rep_msckf: "GLOBAL_3D"
feat_rep_slam: "ANCHORED_MSCKF_INVERSE_DEPTH"
feat_rep_aruco: "ANCHORED_MSCKF_INVERSE_DEPTH"

try_zupt: false
zupt_chi2_multipler: 0
zupt_max_velocity: 0.1
zupt_noise_multiplier: 10
zupt_max_disparity: 0.5
zupt_only_at_beginning: false

# initialization: handheld bag, the platform may never be fully static -> dynamic init as fallback
init_window_time: 2.0
init_imu_thresh: 0.1   # Rig-D: ground robot accelerates gently (acc std 0.15 m/s^2 in the first 1 s of motion, static 0.01-0.02)
init_max_disparity: 1.0   # Rig-D: static->moving detected at motion onset (static disparity 0.04 px); 10 px fired at ~0.6 m/s and the static init then set v = 0 -> wrong scale
init_max_features: 50
init_dyn_use: true   # the platform is moving from the first frame, static init never triggers
init_dyn_mle_opt_calib: false
init_dyn_mle_max_iter: 300   # default 50/0.05 s hit "Maximum solver time reached" -> poor init -> 10-20 m/s transient
init_dyn_mle_max_time: 2.0
init_dyn_mle_max_threads: 6
init_dyn_num_pose: 6
init_dyn_min_deg: 10.0
init_dyn_inflation_ori: 10
init_dyn_inflation_vel: 100
init_dyn_inflation_bg: 10
init_dyn_inflation_ba: 100
init_dyn_min_rec_cond: 1e-12
init_dyn_bias_g: [ 0.0, 0.0, 0.0 ]
init_dyn_bias_a: [ 0.0, 0.0, 0.0 ]

record_timing_information: false
record_timing_filepath: "/tmp/traj_timing.txt"
save_total_state: false
filepath_est: "/tmp/ov_estimate.txt"
filepath_std: "/tmp/ov_estimate_std.txt"
filepath_gt: "/tmp/ov_groundtruth.txt"

# front-end (Rig-D: 960x540 @ 10 Hz after rectification + 0.5 downscale)
use_klt: true
num_pts: 250
fast_threshold: 20
grid_x: 6
grid_y: 5
min_px_dist: 15
knn_ratio: 0.70
track_frequency: 21.0   # must exceed the camera rate: ov_msckf drops any frame arriving < 1/track_frequency after the previous one (10.0 dropped ~40 % of the 10 Hz frames)
downsample_cameras: false
num_opencv_threads: 4
histogram_method: "HISTOGRAM"

use_aruco: false
num_aruco: 1024
downsize_aruco: true

up_msckf_sigma_px: 1
up_msckf_chi2_multipler: 1
up_slam_sigma_px: 1
up_slam_chi2_multipler: 1
up_aruco_sigma_px: 1
up_aruco_chi2_multipler: 1

use_mask: false

relative_config_imu: "kalibr_imu_chain.yaml"
relative_config_imucam: "kalibr_imucam_chain.yaml"
